name: direct_transfer
description: Peer-to-peer file transfer. Bytes go device to device; nothing is stored.
publish_to: "none"
version: 0.2.0+4

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # The wire contract, as a pure Dart package so it can be tested without a
  # device and kept honest against the web client.
  direct_protocol:
    path: packages/direct_protocol

  # Transport. The same WebRTC data channels the web client uses, so the two
  # interoperate over the protocol in protocol/README.md.
  flutter_webrtc: ^1.4.0
  web_socket_channel: ^3.0.1
  http: ^1.2.2

  # Incremental SHA-256, so a large file is never hashed in one piece.
  crypto: ^3.0.6

  file_picker: ^13.1.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1

  # The share link as a QR code, so a desktop sender can hand off to a phone
  # without anyone typing a 64-character capability. Pure Dart painting, no
  # platform channel.
  qr_flutter: ^4.1.0


  # Keeps the transfer running while the app is backgrounded. This is the
  # capability the web client cannot have.
  flutter_foreground_task: ^8.17.0

  # The share link tapped in a chat app arrives here as an intent. Doing this
  # by hand means a platform channel plus the cold-start race between the
  # intent landing and the Flutter engine being ready to hear about it, which
  # is exactly what this package already gets right.
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # The protocol tests are pure Dart and run under `dart test`.
  test: ^1.25.0

flutter:
  uses-material-design: true
