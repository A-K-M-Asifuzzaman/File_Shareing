name: direct_protocol
description: >
  Wire protocol for Direct transfers: message shapes, validation, backpressure
  thresholds and progress maths. Pure Dart on purpose — no Flutter, no
  plugins — so it can be reasoned about and tested without a device, and so
  the rules that must match the web client live in one place.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.12.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
